name: f1-multicloud

services:
  aws-mock:
    image: motoserver/moto:5.2.3
    environment:
      MOTO_PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"

  gcp-mock:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-port", "4443", "-filesystem-root", "/data"]
    ports:
      - "127.0.0.1:4443:4443"
    volumes:
      - gcs-data:/data

  dashboard:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    ports:
      - "127.0.0.1:8501:8501"
    environment: &app-env
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://aws-mock:5000}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_BUCKET: f1-data-lake
      STORAGE_EMULATOR_HOST: http://gcp-mock:4443
      GCP_PROJECT: f1-lab-local
      GCS_BUCKET: f1-data-lake-gcp
      F1_SEASON: ${F1_SEASON:-2025}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-6}
      API_USER_AGENT: F1MultiCloudLab/1.0 (educational project)
    depends_on:
      - aws-mock
      - gcp-mock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    command: ["python", "-m", "f1lab.worker"]
    environment: *app-env
    depends_on:
      - aws-mock
      - gcp-mock
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  gcs-data:
